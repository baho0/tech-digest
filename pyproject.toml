[project]
name = "techdigest"
version = "0.1.0"
description = "Daily digest of genuinely important tech news, delivered by email."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "rapidfuzz>=3.9",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
techdigest = "techdigest.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techdigest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
